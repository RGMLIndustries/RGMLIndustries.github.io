<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
    <style>
        body {
            background-color: #161617; /* Dark background for the page */
            margin: 0; /* Remove default margin */
            padding: 0; /* Remove default padding */
            height: 100vh; /* Set body height to full viewport height */
            display: flex; /* Use flexbox for centering */
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
        }

        /* Style for the main div */
        div.main {
            background-color: #2f2f32; /* Slightly lighter background for the main div */
            width: 50vw; /* Width set to 80% of the viewport width */
            height: 50vh; /* Height set to 80% of the viewport height */
            display: flex; /* Use flexbox for centering inner content */
            justify-content: center; /* Center content horizontally within main div */
            align-items: center; /* Center content vertically within main div */
            color: white; /* Text color for better contrast */
            border-radius: 0.8em; /* Rounded corners */
            padding: 20px; /* Optional padding inside the main div */
        }

        /* Style for the image */
        img {
            width: 150px; /* Set image width */
            height: auto; /* Maintain aspect ratio */
            margin-bottom: 20px; /* Add space below the image */
            background: #555;
            padding: 10px;
            border-radius: 0.5em;
        }

        h1, p {
            text-align: center; /* Center-align text within their container */
            font-size: 50%;
        }
    </style>
</head>
<body>
    <div class="main">
        <div style="text-align: center;">
            <!-- Image -->
            <img src="https://raw.githubusercontent.com/RGMLIndustries/RGMLIndustries.github.io/refs/heads/main/unnamed.jpg" alt="RGML Logo">
            
            <!-- Heading -->
            <h3>Coming Soon</h3>
            
            <!-- Paragraph -->
            <p>© Firefox Browser</p>
        </div>
    </div>
</body>
</html>
